# Supabase 로컬 설정 예시
# supabase init 후 생성되는 config.toml에 아래 내용을 참고하여 수정하세요.
# 이 프로젝트는 인증에 NextAuth를 사용하므로 Supabase Auth([auth]) 설정은 불필요합니다.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# 원격(클라우드) DB와 동일한 메이저 버전 사용. 원격에서 `SHOW server_version;`으로 확인.
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

# 파일 업로드용 버킷 (앱의 NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET_NAME과 이름 일치 필요)
# config.toml에 추가 후 `npm run db:reset` 또는 `npx supabase seed buckets`로 생성됨
[storage.buckets.public-assets]
public = true
file_size_limit = "50MiB"
allowed_mime_types = ["image/*", "application/pdf", "application/zip"]

[analytics]
enabled = false

# Edge Functions (필요시 활성화)
[functions]
enabled = false
